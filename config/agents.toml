# Конфигурация пула Lab100 (рабочий вариант).
# kind = search (веб-поиск/скрейпинг, расход — кредиты) | llm (генерация, расход — токены).
# Провайдер без ключа/доступа автоматически исключается при старте.

[provider.firecrawl]
kind = "search"
capabilities = ["web-search", "deep-research", "scrape"]
priority = 50

[provider.ollama]
kind = "llm"
base_url = "http://127.0.0.1:11434"
model = "hermes3:3b"
capabilities = ["answer", "code"]
priority = 40

# Резерв под глубокие задачи: медленнее (CPU ~10-15 ток/с), активируется
# по запросу (--provider ollama-8b) или когда быстрый агент в cooldown.
[provider.ollama-8b]
kind = "llm"
base_url = "http://127.0.0.1:11434"
model = "hermes3:8b"
capabilities = ["answer", "code"]
priority = 20

[provider.gemini]
kind = "llm"
api_key = ""
model = "gemini-2.5-flash"
capabilities = ["answer", "code", "vision"]
priority = 60

# Квоты: у Firecrawl — кредиты, у LLM — токены; без limit — неограничено.
[quota.firecrawl]
window = "month"
limit = 1000

[quota.ollama]
window = "forever"

[quota.gemini]
window = "day"
limit = 150000

[pool]
default_limit = 5