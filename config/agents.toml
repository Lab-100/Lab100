# Конфигурация пула Lab100 (рабочий вариант).
# kind = search (веб-поиск/скрейпинг, расход — кредиты) | llm (генерация, расход — токены).
# Провайдер без ключа/доступа автоматически исключается при старте.

[provider.firecrawl]
kind = "search"
capabilities = ["web-search", "deep-research", "scrape"]
priority = 50

# Exa — семантический веб-поиск (облако, кейс 2): /search с highlights + /contents.
# Поднимается при наличии EXA_API_KEY.
[provider.exa]
kind = "search"
capabilities = ["web-search", "deep-research", "scrape"]
priority = 45

# ── Кейс 1: полностью локальная палитра (без Firecrawl, 0 кредитов) ──────────
# local-browser — headless Edge/Chrome через драйвер: поиск Bing/DDG + JS-скрейпинг.
# plain-http — самый лёгкий HTTP-скрейпинг без браузера (статические страницы).
[provider.local-browser]
kind = "search"
base_url = "http://127.0.0.1:8123"
engine = "wiby"                # wiby | bing | duckduckgo | wikipedia
auto_start = true
capabilities = ["web-search", "deep-research", "scrape"]
priority = 30

[provider.plain-http]
kind = "search"
capabilities = ["web-search", "scrape"]
priority = 20

# Yandex Search API (платный, тарификация по запросам) — только веб-поиск по базе
# Яндекса, сильный источник по РУ-интернету. Ключ: YANDEX_SEARCH_API_KEY
# (или YANDEX_SEARCH_IAM_TOKEN для сервисного аккаунта), folderId: YANDEX_SEARCH_FOLDER_ID.
# Ставится последним: без ключа исключается при старте, квота ограничивает расход.
[provider.yandex-search]
kind = "search"
folder_id = ""
search_type = "SEARCH_TYPE_RU"    # RU | COM | TR | KK | BE | UZ
family_mode = "FAMILY_MODE_MODERATE"
max_passages = 2
capabilities = ["web-search"]
priority = 15

[provider.ollama]
kind = "llm"
base_url = "http://127.0.0.1:11434"
model = "hermes3:3b"
capabilities = ["answer", "code"]
priority = 40

# Резерв под глубокие задачи: медленнее (CPU ~10-15 ток/с), активируется
# по запросу (--provider ollama-8b) или когда быстрый агент в cooldown.
[provider.ollama-8b]
kind = "llm"
base_url = "http://127.0.0.1:11434"
model = "hermes3:8b"
capabilities = ["answer", "code"]
priority = 20

[provider.gemini]
kind = "llm"
api_key = ""
model = "gemini-3.6-flash"
capabilities = ["answer", "code", "vision"]
priority = 60

# Docker Agent (Гордон) — бесплатный локальный LLM через Model Runner (smollm2),
# член группы перебора LLM. Поднимается только если установлен плагин `docker agent`
# (gordon-setup.ps1) и есть ~\.agents\gordon.yaml; иначе отключается с пояснением.
[provider.docker-agent]
kind = "llm"
agent_file = ""
model = "local"                # local = Docker Model Runner (бесплатно)
capabilities = ["answer", "code"]
priority = 10                 # ниже ollama-8b: медленный резерв без ключей
timeout_s = 600

# docker-cloud — облачные модели ЧЕРЕЗ docker agent (ключ провайдера берётся из
# env). Дефолт — groq/llama-3.3-70b-versatile (бесплатный rate-limit tier);
# Docker-каталог (docker agent models) поддерживает и платных: xai, anthropic, ...
[provider.docker-cloud]
kind = "llm"
agent_file = ""
model = "groq/llama-3.3-70b-versatile"
capabilities = ["answer", "code"]
priority = 15
timeout_s = 600

# Квоты: у Firecrawl — кредиты, у LLM — токены; без limit — неограничено.
[quota.firecrawl]
window = "month"
limit = 1000

[quota.exa]
window = "forever"

[quota.local-browser]
window = "forever"

[quota.plain-http]
window = "forever"

# Yandex Search API: тарификация по числу запросов, 10 000 синхронных запросов в час.
# Месячный предохранитель в пуле: не даём израсходовать больше 500 запросов за окно
# (при reserve_portions агент уходит в «пустые», когда остаток < 10% окна).
[quota.yandex-search]
window = "month"
limit = 500
reserve_portions = 0.1

[quota.ollama]
window = "forever"

[quota.gemini]
window = "day"
limit = 150000

[quota.docker-agent]
window = "forever"

[quota.docker-cloud]
window = "forever"

[pool]
default_limit = 5