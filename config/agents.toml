# Конфигурация пула Lab100.
# Квоты — из кейса 2 (бесплатные тиры провайдеров). Правьте под текущие условия.

[provider.gemini]
capabilities = ["web-search", "deep-research", "vision"]
priority = 30

[provider.groq]
capabilities = ["web-search", "code"]
priority = 25

[provider.kimi]
capabilities = ["web-search", "deep-research"]
priority = 20

[provider.cerebras]
capabilities = ["code", "web-search"]
priority = 15

[provider.cloudflare-workers]
capabilities = ["web-search", "scrape"]
priority = 10

[provider.pollinations]
capabilities = ["web-search", "code", "vision"]
priority = 5

[provider.ollama]
capabilities = ["web-search", "code", "scrape", "deep-research", "vision"]
priority = 1

[quota.gemini]
window = "day"
limit = 1500

[quota.groq]
window = "day"
limit = 1000

[quota.kimi]
window = "month"
limit = 1000

[quota.cerebras]
window = "day"
limit = 1000000

[quota.cloudflare-workers]
window = "day"
limit = 10000

# Pollinations и Ollama: limit отсутствует = бесконечная квота.
[quota.pollinations]
window = "forever"

[quota.ollama]
window = "forever"