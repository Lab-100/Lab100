name: gemini-model-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [gemini-3.6-flash, gemini-3.5-flash-lite, gemini-3.1-pro-preview]
    steps:
      - name: Check model generate
        run: |
          echo "== model: ${{ matrix.model }} =="
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/${{ matrix.model }}:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"say ok"}]}]}' \
            -w "\nHTTP_CODE:%{http_code}\n" | head -c 600